name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Ruff
        run: ruff check src app.py tests

      - name: Black
        run: black --check src app.py tests

      - name: Mypy
        run: mypy src app.py

  test-and-smoke:
    name: Test and smoke workflow on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      MPLBACKEND: Agg
      PYTHONWARNINGS: ignore

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check source files compile
        run: |
          python -m compileall src app.py tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Note on smoke testing
        run: |
          echo "Smoke test skipped: Project now uses real ULB dataset (284,807 records, 143 MB)"
          echo "Full pipeline testing should be done locally before pushing."
          echo "See: python -m src.data_prep && python -m src.train_model && python -m src.evaluate"
